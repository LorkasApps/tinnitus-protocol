  <rect width="1024" height="500" fill="#00897B"/>

  <!-- Notebook icon on left -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="240" height="320" rx="22" ry="22" fill="#FFFFFF"/>
    <rect x="28" y="28" width="12" height="264" fill="#00897B"/>
    <rect x="60" y="64" width="152" height="16" fill="#00897B"/>
    <rect x="60" y="118" width="152" height="16" fill="#00897B"/>
    <rect x="60" y="172" width="152" height="16" fill="#00897B"/>
